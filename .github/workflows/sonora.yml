name: Sonora - compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Aceptar licencias del Android SDK
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK (debug)
        env:
          # Opcional: crea el secreto JAMENDO_CLIENT_ID en Settings > Secrets and variables > Actions
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: ./gradlew assembleCoreDebug --stacktrace

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-debug-apk
          path: app/build/outputs/apk/core/debug/*.apk
